name: Dependency audit
on:
  # Disabled in this fork: automatic runs are not wanted here. Restore the
  # push, pull_request, and schedule triggers to run this audit again.
  # pull_request:
  # push:
  #   branches: [main]
  # schedule:
  #   - cron: '17 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
